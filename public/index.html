<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking App</title>
    <style>
        /* Modern CSS Variables for instant theme switching */
        :root {
            --bg-nav: #0b0c14;
            --bg-sidebar: #13141f;
            --bg-chat: #1a1b26;
            --bg-card: #222436;
            --accent: #6366f1;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2d3139;
        }

        /* Cyberpunk Theme values */
        [data-theme="cyberpunk"] {
            --bg-nav: #020014;
            --bg-sidebar: #0f0226;
            --bg-chat: #14052b;
            --bg-card: #240c47;
            --accent: #00f5ff;
            --text-main: #00f5ff;
            --text-muted: #ec38bc;
            --border: #ec38bc;
        }

        /* Amethyst Theme values */
        [data-theme="amethyst"] {
            --bg-nav: #120d1e;
            --bg-sidebar: #1a1429;
            --bg-chat: #211a34;
            --bg-card: #2d2447;
            --accent: #b55fe6;
            --text-main: #f3e8ff;
            --text-muted: #a78bfa;
            --border: #3b2e5c;
        }

        /* Light Theme values */
        [data-theme="light"] {
            --bg-nav: #e2e8f0;
            --bg-sidebar: #f1f5f9;
            --bg-chat: #ffffff;
            --bg-card: #f8fafc;
            --accent: #3b82f6;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.2s, color 0.2s; }
        body { background-color: var(--bg-nav); display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-main); overflow: hidden; }

        /* Login Screen Setup */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0f0f12; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background-color: #1a1b23; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2d3139; }
        .login-box h2 { margin-bottom: 20px; color: #fff; }
        .login-box input[type="text"] { width: 100%; padding: 12px; background-color: #0f0f12; border: 1px solid #3f4452; border-radius: 8px; color: #fff; margin-bottom: 20px; outline: none; }
        .login-box input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 8px; background: transparent; cursor: pointer; margin-bottom: 25px; }
        .join-btn { width: 100%; padding: 12px; background-color: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Master Grid Container */
        .app-container { display: flex; width: 98%; max-width: 1400px; height: 92vh; background-color: var(--bg-chat); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid var(--border); }

        /* Leftmost Action Row Icon Deck (Discord Style) */
        .nav-dock { width: 75px; background-color: var(--bg-nav); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 15px; border-right: 1px solid var(--border); }
        .dock-icon { width: 50px; height: 50px; border-radius: 50%; background-color: var(--bg-card); display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--text-muted); border: 2px solid transparent; }
        .dock-icon.active, .dock-icon:hover { border-color: var(--accent); color: var(--accent); border-radius: 15px; }

        /* Second Column List Area */
        .sidebar { width: 240px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--text-main); font-size: 1.1rem; }
        .list-items { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
        .list-item { padding: 10px 15px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .list-item.active, .list-item:hover { background-color: var(--bg-card); color: var(--text-main); }

        /* Identity Bar */
        .profile-bar { padding: 15px; background-color: var(--bg-nav); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background-color: var(--accent); flex-shrink: 0; }

        /* Central Workspace Panel */
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); position: relative; }
        .view-panel { display: none; flex-direction: column; height: 100%; width: 100%; }
        .view-panel.active { display: flex; }

        /* Chat View Subcomponents */
        .chat-header { padding: 20px 24px; border-bottom: 1px solid var(--border); font-size: 1.1rem; font-weight: bold; }
        .chat-history { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        .message-row { display: flex; gap: 12px; max-width: 80%; margin-bottom: 2px; }
        .message-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.them { align-self: flex-start; }
        .msg-container { display: flex; flex-direction: column; }
        .message-row.me .msg-container { align-items: flex-end; }
        .sender-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
        .bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .message-row.them .bubble { background-color: var(--bg-card); color: var(--text-main); border-top-left-radius: 4px; }
        .message-row.me .bubble { background-color: var(--accent); color: #fff; border-top-right-radius: 4px; }
        .input-deck { padding: 20px; background-color: var(--bg-chat); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-deck input { flex: 1; padding: 14px 20px; background-color: var(--bg-nav); border: 1px solid var(--border); border-radius: 25px; color: var(--text-main); outline: none; }
        .input-deck input:focus { border-color: var(--accent); }
        .action-btn { background-color: var(--accent); color: white; border: none; border-radius: 25px; padding: 0 22px; font-weight: bold; cursor: pointer; }

        /* Settings View Panel layout */
        .settings-layout { padding: 40px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto; }
        .setting-section { background-color: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
        .setting-section h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        .theme-card { padding: 15px; text-align: center; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; font-weight: bold; background: var(--bg-nav); }
        .theme-card:hover { border-color: var(--accent); }

        .profile-edit-form { display: flex; flex-direction: column; gap: 12px; max-width: 300px; }
        .profile-edit-form input { padding: 10px; background: var(--bg-nav); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); outline: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Welcome to Talking App</h2>
            <input type="text" id="initial-username" placeholder="Pick a username..." maxlength="15">
            <span style="color:#94a3b8; font-size:0.85rem; display:block; margin-bottom:8px;">Select Theme Base Color:</span>
            <input type="color" id="initial-color" value="#6366f1">
            <button class="join-btn" id="enter-app-btn">Enter App</button>
        </div>
    </div>

    <div class="app-container">
        
        <div class="nav-dock">
            <div class="dock-icon active" id="dock-servers-btn" title="Servers">🌐</div>
            <div class="dock-icon" id="dock-dms-btn" title="Direct Messages">💬</div>
            <div class="dock-icon" id="dock-settings-btn" title="Settings">⚙️</div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header" id="sidebar-category-title">Servers</div>
            <div class="list-items" id="sidebar-directory-items">
                </div>
            <div class="profile-bar">
                <div class="avatar" id="global-profile-avatar"></div>
                <div style="overflow: hidden;"><div id="global-profile-name" style="font-weight:bold; white-space:nowrap; text-overflow:ellipsis;">User</div><span style="font-size:0.75rem; color:#4ade80;">Active</span></div>
            </div>
        </div>

        <div class="main-content">
            
            <div id="panel-chat-view" class="view-panel active">
                <div class="chat-header" id="active-chat-title"># global-lounge</div>
                <div class="chat-history" id="chat-scroller"></div>
                <div class="input-deck">
                    <input type="text" id="chat-input-field" placeholder="Type a message...">
                    <button class="action-btn" id="chat-send-btn">Send</button>
                </div>
            </div>

            <div id="panel-settings-view" class="view-panel">
                <div class="settings-layout">
                    <div class="setting-section">
                        <h3>User Profile Setup</h3>
                        <div class="profile-edit-form">
                            <label style="font-size:0.85rem; color:var(--text-muted)">Change Nickname</label>
                            <input type="text" id="settings-name-input">
                            <button class="join-btn" id="save-profile-btn" style="padding:8px; margin-top:5px;">Update Profile</button>
                        </div>
                    </div>

                    <div class="setting-section">
                        <h3>Interface Themes</h3>
                        <div class="theme-grid">
                            <div class="theme-card" onclick="setTheme('dark')">Midnight Dark</div>
                            <div class="theme-card" onclick="setTheme('cyberpunk')" style="color:#00f5ff;">Cyberpunk Neon</div>
                            <div class="theme-card" onclick="setTheme('amethyst')" style="color:#b55fe6;">Amethyst</div>
                            <div class="theme-card" onclick="setTheme('light')">Classic Light</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Local State Profile Engine Data
        let currentUser = { username: "Guest", color: "#6366f1" };
        let activeScope = "servers"; // Current mode: servers / dms / settings
        let activeTarget = "global-lounge"; // Active sub-channel identifier
        
        // Dynamic In-Memory Cache for Separating Chat Histories
        const recordsCache = {
            "global-lounge": [],
            "coding-zone": [],
            "chatgpt-bot": [{ text: "Hello! I am your AI companion inside Talking App. Ask me anything!", username: "ChatGPT", color: "#10b981", side: "them" }]
        };

        // DOM Targets
        const chatScroller = document.getElementById('chat-scroller');
        const inputField = document.getElementById('chat-input-field');
        const directoryContainer = document.getElementById('sidebar-directory-items');
        
        // Authorization Gate Processing
        document.getElementById('enter-app-btn').addEventListener('click', () => {
            const desiredName = document.getElementById('initial-username').value.trim();
            if(desiredName) {
                currentUser.username = desiredName;
                currentUser.color = document.getElementById('initial-color').value;
                
                document.getElementById('global-profile-name').innerText = currentUser.username;
                document.getElementById('global-profile-avatar').style.backgroundColor = currentUser.color;
                document.getElementById('settings-name-input').value = currentUser.username;
                
                document.getElementById('login-screen').style.display = 'none';
                renderSidebar();
            }
        });

        // Category Router Core Handlers
        document.getElementById('dock-servers-btn').addEventListener('click', (e) => switchContext('servers', e.target));
        document.getElementById('dock-dms-btn').addEventListener('click', (e) => switchContext('dms', e.target));
        document.getElementById('dock-settings-btn').addEventListener('click', (e) => {
            switchContext('settings', e.target);
            showPanel('panel-settings-view');
        });

        function switchContext(mode, element) {
            document.querySelectorAll('.dock-icon').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            activeScope = mode;
            
            if (mode !== 'settings') {
                showPanel('panel-chat-view');
                document.getElementById('sidebar-category-title').innerText = mode === 'servers' ? 'Servers' : 'Direct Messages';
                renderSidebar();
            }
        }

        function showPanel(panelId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        }

        // Subdirectory Render Controller
        function renderSidebar() {
            directoryContainer.innerHTML = "";
            let targets = modeItems[activeScope] || [];
            
            if(targets.length > 0 && !targets.some(t => t.id === activeTarget)) {
                activeTarget = targets[0].id;
            }

            targets.forEach(item => {
                const el = document.createElement('div');
                el.className = `list-item ${item.id === activeTarget ? 'active' : ''}`;
                el.innerText = item.label;
                el.addEventListener('click', () => {
                    activeTarget = item.id;
                    renderSidebar();
                    loadChannelFeed();
                });
                directoryContainer.appendChild(el);
            });
            loadChannelFeed();
        }

        const modeItems = {
            servers: [{id: 'global-lounge', label: '# global-lounge'}, {id: 'coding-zone', label: '# coding-zone'}],
            dms: [{id: 'chatgpt-bot', label: '🤖 ChatGPT (AI)'}]
        };

        // Theme Switch Execution Engine
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
        }

        // Profile Data Updates Management
        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const updatedName = document.getElementById('settings-name-input').value.trim();
            if(updatedName) {
                currentUser.username = updatedName;
                document.getElementById('global-profile-name').innerText = updatedName;
                alert('Profile updated successfully!');
            }
        });

        // Chat View Render Core Engine
        function loadChannelFeed() {
            document.getElementById('active-chat-title').innerText = activeTarget.includes('bot') ? "Talk to AI Bot" : `# ${activeTarget}`;
            chatScroller.innerHTML = "";
            let stream = recordsCache[activeTarget] || [];
            stream.forEach(msg => drawBubbleLayout(msg.text, msg.username, msg.color, msg.side));
            chatScroller.scrollTop = chatScroller.scrollHeight;
        }

        function drawBubbleLayout(text, name, color, side) {
            const row = document.createElement('div');
            row.className = `message-row ${side}`;
            row.innerHTML = `
                <div class="avatar" style="background-color: ${color}"></div>
                <div class="msg-container">
                    <span class="sender-label">${name}</span>
                    <div class="bubble">${text}</div>
                </div>
            `;
            chatScroller.appendChild(row);
            chatScroller.scrollTop = chatScroller.scrollHeight;
        }

        // Message Shipping System Trigger
        function fireMessageTransmission() {
            const text = inputField.value.trim();
            if(!text) return;

            // Commit data array tracking profile properties
            if(!recordsCache[activeTarget]) recordsCache[activeTarget] = [];
            recordsCache[activeTarget].push({ text: text, username: currentUser.username, color: currentUser.color, side: 'me' });
            
            drawBubbleLayout(text, currentUser.username, currentUser.color, 'me');
            inputField.value = '';

            // Route execution conditionally if target interface points to ChatGPT instance
            if(activeTarget === 'chatgpt-bot') {
                triggerAutomatedAiSimulation(text);
            } else {
                socket.emit('chat message', {
                    text: text,
                    username: currentUser.username,
                    avatarColor: currentUser.color,
                    room: activeTarget
                });
            }
        }

        document.getElementById('chat-send-btn').addEventListener('click', fireMessageTransmission);
        inputField.addEventListener('keypress', (e) => { if(e.key === 'Enter') fireMessageTransmission(); });

        // Automated Local Companion Smart Script Engine (ChatGPT Option)
        function triggerAutomatedAiSimulation(prompt) {
            setTimeout(() => {
                let responses = [
                    "That sounds fascinating! Tell me more about it.",
                    "I am currently processing your request inside Talking App. Everything is functioning flawlessly!",
                    "That is an excellent point. Have you considered optimizing the codebase further?",
                    "As an AI, I am highly impressed by this dark interface you engineered!",
                    "Let's write some more code! What features should we add next?"
                ];
                let randomizedReply = responses[Math.floor(Math.random() * responses.length)];
                
                recordsCache['chatgpt-bot'].push({ text: randomizedReply, username: "ChatGPT", color: "#10b981", side: "them" });
                if(activeTarget === 'chatgpt-bot') {
                    drawBubbleLayout(randomizedReply, "ChatGPT", "#10b981", "them");
                }
            }, 850);
        }

        // Global Event Line Network Listener
        socket.on('chat message', (data) => {
            if(!recordsCache[data.room]) recordsCache[data.room] = [];
            
            // Push inside dynamic structural history array
            recordsCache[data.room].push({ text: data.text, username: data.username, color: data.avatarColor, side: 'them' });
            
            // Draw element immediately onto rendering map viewport context if room matches target space
            if(activeTarget === data.room) {
                drawBubbleLayout(data.text, data.username, data.avatarColor, 'them');
            }
        });
    </script>
</body>
</html>
