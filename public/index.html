<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Dark Chatroom</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background-color: #0f0f12; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #e2e8f0;
        }

        /* Login Screen Overlay */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .login-box {
            background-color: #1a1b23;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #2d3139;
        }

        .login-box h2 { margin-bottom: 20px; color: #fff; }
        
        .login-box input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            background-color: #0f0f12;
            border: 1px solid #3f4452;
            border-radius: 8px;
            color: #fff;
            outline: none;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .color-picker-label { margin-bottom: 8px; display: block; font-size: 0.9rem; color: #94a3b8; }
        
        .login-box input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .join-btn {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .join-btn:hover { background-color: #4f46e5; }

        /* Main App Container */
        .app-container { 
            display: flex; 
            width: 95%; 
            max-width: 1100px; 
            height: 85vh; 
            background-color: #1a1b23; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            overflow: hidden; 
            border: 1px solid #2d3139;
        }

        /* Sidebar styling */
        .sidebar { width: 260px; background-color: #13141c; border-right: 1px solid #2d3139; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #2d3139; color: #fff; }
        .profile-card { display: flex; align-items: center; padding: 20px; background-color: #1a1b23; margin: auto 15px 15px 15px; border-radius: 10px; border: 1px solid #2d3139; }
        
        /* Chat Window styling */
        .chat-window { flex: 1; display: flex; flex-direction: column; background-color: #1a1b23; }
        .chat-header { padding: 20px 24px; border-bottom: 1px solid #2d3139; color: #fff; font-size: 1.2rem; }
        .chat-history { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* Interactive Message Rows */
        .message-row { display: flex; gap: 12px; max-width: 75%; }
        .message-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.them { align-self: flex-start; }

        .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
        
        .msg-body { display: flex; flex-direction: column; }
        .message-row.me .msg-body { align-items: flex-end; }

        .meta-name { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        
        .bubble { 
            padding: 12px 18px; 
            border-radius: 18px; 
            font-size: 0.95rem; 
            line-height: 1.5; 
            word-break: break-word;
        }
        .message-row.them .bubble { background-color: #2d3139; color: #f1f5f9; border-top-left-radius: 4px; }
        .message-row.me .bubble { background-color: #6366f1; color: #ffffff; border-top-right-radius: 4px; }

        /* Input Deck */
        .input-area { padding: 20px 24px; background-color: #1a1b23; border-top: 1px solid #2d3139; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 14px 24px; background-color: #0f0f12; border: 1px solid #2d3139; border-radius: 30px; color: #fff; outline: none; font-size: 0.95rem; }
        .input-area input:focus { border-color: #6366f1; }
        .send-btn { background-color: #6366f1; color: white; border: none; border-radius: 30px; padding: 0 24px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { background-color: #4f46e5; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Set Your Profile</h2>
            <input type="text" id="username-input" placeholder="Enter your nickname..." maxlength="15">
            <span class="color-picker-label">Choose Avatar Color:</span>
            <input type="color" id="avatar-color" value="#6366f1">
            <button class="join-btn" id="join-btn">Launch Chat</button>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">🌌 Orbit Lounge</div>
            <div class="profile-card">
                <div class="avatar" id="my-profile-avatar"></div>
                <div style="margin-left: 12px;"><strong id="my-profile-name" style="color: #fff;">Anonymous</strong><div style="font-size: 0.75rem; color: #4ade80;">Online</div></div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">Global Text Feed</div>
            <div class="chat-history" id="chat-history"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Say something nice...">
                <button class="send-btn" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Runtime Profile variables
        let myUsername = "Anonymous";
        let myColor = "#6366f1";

        // Element targets
        const loginScreen = document.getElementById('login-screen');
        const usernameInput = document.getElementById('username-input');
        const avatarColorInput = document.getElementById('avatar-color');
        const joinBtn = document.getElementById('join-btn');
        
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');

        // Authentication trigger
        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name !== '') {
                myUsername = name;
                myColor = avatarColorInput.value;
                
                // Update local UI representation
                document.getElementById('my-profile-name').innerText = myUsername;
                document.getElementById('my-profile-avatar').style.backgroundColor = myColor;
                
                // Remove login screen layer
                loginScreen.style.display = 'none';
            } else {
                alert("Please enter a valid nickname!");
            }
        });

        // Interface rendering engine
        function appendMessage(text, username, color, side) {
            const row = document.createElement('div');
            row.className = `message-row ${side}`;
            
            row.innerHTML = `
                <div class="avatar" style="background-color: ${color}"></div>
                <div class="msg-body">
                    <span class="meta-name">${username}</span>
                    <div class="bubble">${text}</div>
                </div>
            `;
            
            chatHistory.appendChild(row);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleSend() {
            const text = messageInput.value.trim();
            if (text !== '') {
                // Render locally immediately
                appendMessage(text, myUsername, myColor, 'me');
                
                // Ship message packet across WebSocket
                socket.emit('chat message', {
                    text: text,
                    username: myUsername,
                    avatarColor: myColor
                });
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', handleSend);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

        // Capture incoming moderated broadcasts
        socket.on('chat message', (data) => {
            appendMessage(data.text, data.username, data.avatarColor, 'them');
        });
    </script>
</body>
</html>
