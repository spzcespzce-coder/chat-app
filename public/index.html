<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking App</title>
    <style>
        :root {
            --bg-nav: #0b0c14;
            --bg-sidebar: #13141f;
            --bg-chat: #1a1b26;
            --bg-card: #222436;
            --accent: #6366f1;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #2d3139;
        }
        [data-theme="cyberpunk"] {
            --bg-nav: #020014; --bg-sidebar: #0f0226; --bg-chat: #14052b; --bg-card: #240c47;
            --accent: #00f5ff; --text-main: #00f5ff; --text-muted: #ec38bc; --border: #ec38bc;
        }
        [data-theme="amethyst"] {
            --bg-nav: #120d1e; --bg-sidebar: #1a1429; --bg-chat: #211a34; --bg-card: #2d2447;
            --accent: #b55fe6; --text-main: #f3e8ff; --text-muted: #a78bfa; --border: #3b2e5c;
        }
        [data-theme="light"] {
            --bg-nav: #e2e8f0; --bg-sidebar: #f1f5f9; --bg-chat: #ffffff; --bg-card: #f8fafc;
            --accent: #3b82f6; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-nav); display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-main); overflow: hidden; }

        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0f0f12; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background-color: #1a1b23; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2d3139; }
        .login-box input[type="text"] { width: 100%; padding: 12px; background-color: #0f0f12; border: 1px solid #3f4452; border-radius: 8px; color: #fff; margin-bottom: 20px; outline: none; }
        .login-box input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 8px; background: transparent; cursor: pointer; margin-bottom: 25px; }
        .join-btn { width: 100%; padding: 12px; background-color: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .app-container { display: flex; width: 98%; max-width: 1400px; height: 92vh; background-color: var(--bg-chat); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
        
        .nav-dock { width: 75px; background-color: var(--bg-nav); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 15px; border-right: 1px solid var(--border); }
        .dock-icon { width: 50px; height: 50px; border-radius: 50%; background-color: var(--bg-card); display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; color: var(--text-muted); border: 2px solid transparent; }
        .dock-icon.active, .dock-icon:hover { border-color: var(--accent); color: var(--accent); border-radius: 15px; }

        .sidebar { width: 240px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); font-size: 1.1rem; }
        .list-items { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
        .list-item { padding: 10px 15px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500; }
        .list-item.active, .list-item:hover { background-color: var(--bg-card); color: var(--text-main); }

        .profile-bar { padding: 15px; background-color: var(--bg-nav); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background-color: var(--accent); flex-shrink: 0; }

        .main-content { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); }
        .view-panel { display: none; flex-direction: column; height: 100%; width: 100%; }
        .view-panel.active { display: flex; }

        .chat-header { padding: 20px 24px; border-bottom: 1px solid var(--border); font-size: 1.1rem; font-weight: bold; }
        .chat-history { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        .message-row { display: flex; gap: 12px; max-width: 80%; }
        .message-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-container { display: flex; flex-direction: column; }
        .message-row.me .msg-container { align-items: flex-end; }
        .sender-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
        .bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .message-row.them .bubble { background-color: var(--bg-card); color: var(--text-main); border-top-left-radius: 4px; }
        .message-row.me .bubble { background-color: var(--accent); color: #fff; border-top-right-radius: 4px; }
        
        .input-deck { padding: 20px; background-color: var(--bg-chat); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-deck input { flex: 1; padding: 14px 20px; background-color: var(--bg-nav); border: 1px solid var(--border); border-radius: 25px; color: var(--text-main); outline: none; }
        .action-btn { background-color: var(--accent); color: white; border: none; border-radius: 25px; padding: 0 22px; font-weight: bold; cursor: pointer; }

        .social-layout, .settings-layout { padding: 40px; display: flex; flex-direction: column; gap: 25px; overflow-y: auto; }
        .section-card { background-color: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
        .section-card h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .social-input-group { display: flex; gap: 10px; max-width: 400px; margin-bottom: 15px; }
        .social-input-group input { flex: 1; padding: 10px; background: var(--bg-nav); border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }
        
        .request-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--bg-nav); border-radius: 6px; margin-bottom: 8px; }
        .sm-btn { padding: 6px 12px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .theme-card { padding: 15px; text-align: center; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; font-weight: bold; background: var(--bg-nav); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Welcome to Talking App</h2>
            <input type="text" id="initial-username" placeholder="Pick a username..." maxlength="15">
            <input type="color" id="initial-color" value="#6366f1">
            <button class="join-btn" id="enter-app-btn">Enter App</button>
        </div>
    </div>

    <div class="app-container">
        <div class="nav-dock">
            <div class="dock-icon active" id="dock-servers-btn" title="Chatrooms">🌐</div>
            <div class="dock-icon" id="dock-social-btn" title="Friends System">👥</div>
            <div class="dock-icon" id="dock-settings-btn" title="Settings">⚙️</div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header" id="sidebar-category-title">Channels</div>
            <div class="list-items" id="sidebar-directory-items"></div>
            <div class="profile-bar">
                <div class="avatar" id="global-profile-avatar"></div>
                <div><div id="global-profile-name" style="font-weight:bold;">User</div><span style="font-size:0.75rem; color:#4ade80;">Online</span></div>
            </div>
        </div>

        <div class="main-content">
            <div id="panel-chat-view" class="view-panel active">
                <div class="chat-header" id="active-chat-title"># global-lounge</div>
                <div class="chat-history" id="chat-scroller"></div>
                <div class="input-deck">
                    <input type="text" id="chat-input-field" placeholder="Type a message...">
                    <button class="action-btn" id="chat-send-btn">Send</button>
                </div>
            </div>

            <div id="panel-social-view" class="view-panel">
                <div class="social-layout">
                    <div class="section-card">
                        <h3>Add a Friend</h3>
                        <div class="social-input-group">
                            <input type="text" id="friend-target-input" placeholder="Enter friend's exact username...">
                            <button class="sm-btn" id="send-request-btn">Send Request</button>
                        </div>
                    </div>
                    <div class="section-card">
                        <h3>Pending Requests</h3>
                        <div id="pending-requests-box">No requests pending.</div>
                    </div>
                </div>
            </div>

            <div id="panel-settings-view" class="view-panel">
                <div class="settings-layout">
                    <div class="section-card">
                        <h3>Interface Themes</h3>
                        <div class="theme-grid">
                            <div class="theme-card" onclick="setTheme('dark')">Midnight Dark</div>
                            <div class="theme-card" onclick="setTheme('cyberpunk')" style="color:#00f5ff;">Cyberpunk</div>
                            <div class="theme-card" onclick="setTheme('amethyst')" style="color:#b55fe6;">Amethyst</div>
                            <div class="theme-card" onclick="setTheme('light')">Classic Light</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = { username: "Guest", color: "#6366f1" };
        let activeScope = "servers"; 
        let activeTarget = "global-lounge"; 

        const recordsCache = { "global-lounge": [], "coding-zone": [], "chatgpt-bot": [] };
        const friendsList = [];

        const chatScroller = document.getElementById('chat-scroller');
        const inputField = document.getElementById('chat-input-field');
        const directoryContainer = document.getElementById('sidebar-directory-items');

        document.getElementById('enter-app-btn').addEventListener('click', () => {
            const name = document.getElementById('initial-username').value.trim();
            if(name) {
                currentUser.username = name;
                currentUser.color = document.getElementById('initial-color').value;
                document.getElementById('global-profile-name').innerText = name;
                document.getElementById('global-profile-avatar').style.backgroundColor = currentUser.color;
                document.getElementById('login-screen').style.display = 'none';
                
                socket.emit('register-user', currentUser);
                renderSidebar();
            }
        });

        // Navigation Controllers
        document.getElementById('dock-servers-btn').addEventListener('click', () => { activeScope = "servers"; switchPanel('panel-chat-view'); document.getElementById('sidebar-category-title').innerText = "Channels"; renderSidebar(); });
        document.getElementById('dock-social-btn').addEventListener('click', () => { activeScope = "social"; switchPanel('panel-social-view'); document.getElementById('sidebar-category-title').innerText = "Direct Messages"; renderSidebar(); });
        document.getElementById('dock-settings-btn').addEventListener('click', () => { switchPanel('panel-settings-view'); });

        function switchPanel(panelId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.dock-icon').forEach(i => i.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        }

        function renderSidebar() {
            directoryContainer.innerHTML = "";
            let list = [];
            if(activeScope === 'servers') {
                list = [{id:'global-lounge', label:'# global-lounge'}, {id:'coding-zone', label:'# coding-zone'}, {id:'chatgpt-bot', label:'🤖 ChatGPT AI'}];
            } else {
                list = friendsList.map(f => ({id: `dm-${f}`, label: `💬 ${f}`}));
            }

            list.forEach(item => {
                const el = document.createElement('div');
                el.className = `list-item ${item.id === activeTarget ? 'active' : ''}`;
                el.innerText = item.label;
                el.addEventListener('click', () => {
                    activeTarget = item.id;
                    if(activeScope === 'social') switchPanel('panel-chat-view');
                    renderSidebar();
                    loadChannelFeed();
                });
                directoryContainer.appendChild(el);
            });
        }

        function loadChannelFeed() {
            document.getElementById('active-chat-title').innerText = activeTarget.startsWith('dm-') ? `DM: ${activeTarget.split('-')[1]}` : `# ${activeTarget}`;
            chatScroller.innerHTML = "";
            let stream = recordsCache[activeTarget] || [];
            stream.forEach(msg => drawBubbleLayout(msg.text, msg.username, msg.color, msg.side));
            chatScroller.scrollTop = chatScroller.scrollHeight;
        }

        function drawBubbleLayout(text, name, color, side) {
            const row = document.createElement('div');
            row.className = `message-row ${side}`;
            row.innerHTML = `<div class="avatar" style="background-color: ${color}"></div><div class="msg-container"><span class="sender-label">${name}</span><div class="bubble">${text}</div></div>`;
            chatScroller.appendChild(row);
            chatScroller.scrollTop = chatScroller.scrollHeight;
        }

        function sendMessage() {
            const text = inputField.value.trim();
            if(!text) return;

            if(!recordsCache[activeTarget]) recordsCache[activeTarget] = [];
            recordsCache[activeTarget].push({ text, username: currentUser.username, color: currentUser.color, side: 'me' });
            drawBubbleLayout(text, currentUser.username, currentUser.color, 'me');
            inputField.value = '';

            socket.emit('chat message', { text, username: currentUser.username, avatarColor: currentUser.color, room: activeTarget });
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        // Friends Mechanics
        document.getElementById('send-request-btn').addEventListener('click', () => {
            const target = document.getElementById('friend-target-input').value.trim();
            if(target && target !== currentUser.username) {
                socket.emit('send-friend-request', { targetName: target });
                alert(`Friend request sent to ${target}!`);
                document.getElementById('friend-target-input').value = '';
            }
        });

        socket.on('incoming-friend-request', (data) => {
            const container = document.getElementById('pending-requests-box');
            if(container.innerText.includes("No requests")) container.innerHTML = "";

            const div = document.createElement('div');
            div.className = "request-item";
            div.innerHTML = `<span><strong>${data.from}</strong> wants to be friends!</span><button class="sm-btn">Accept</button>`;
            div.querySelector('button').addEventListener('click', () => {
                socket.emit('accept-friend-request', { targetName: data.from });
                friendsList.push(data.from);
                recordsCache[`dm-${data.from}`] = [];
                div.remove();
                if(activeScope === 'social') renderSidebar();
            });
            container.appendChild(div);
        });

        socket.on('friend-request-accepted', (data) => {
            alert(`${data.from} accepted your friend request!`);
            friendsList.push(data.from);
            recordsCache[`dm-${data.from}`] = [];
            if(activeScope === 'social') renderSidebar();
        });

        socket.on('chat message', (data) => {
            if(!recordsCache[data.room]) recordsCache[data.room] = [];
            recordsCache[data.room].push({ text: data.text, username: data.username, color: data.avatarColor, side: 'them' });
            if(activeTarget === data.room) {
                drawBubbleLayout(data.text, data.username, data.avatarColor, 'them');
            }
        });

        function setTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }
    </script>
</body>
</html>
