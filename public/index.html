<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Chat Platform - Edge Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-main: #090d16;
            --panel-bg: #111827;
            --sidebar-bg: #030712;
            --text-dark: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        /* Forces full screen layout to eliminate borders or scrollbars */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: var(--bg-main); 
            color: var(--text-dark); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden; 
        }

        /* Main Overlay Login System Frame Layout logic */
        #auth-overlay { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .auth-box { background: var(--panel-bg); padding: 40px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); width: 380px; text-align: center; border: 1px solid var(--border); }
        .auth-box h2 { font-size: 1.75rem; margin-bottom: 24px; font-weight: 800; tracking: -0.05em; color: white; }
        .auth-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border); background-color: #0b0f19; color: white; border-radius: 8px; outline: none; font-size: 0.95rem; box-sizing: border-box; }
        .auth-input:focus { border-color: var(--primary); }
        .auth-action-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; transition: all 0.2s; }
        .auth-action-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        #auth-log-output { color: #f87171; font-size: 0.85rem; margin-top: 8px; min-height: 20px; font-weight: 500; }

        /* Full Screen Stretched Layout Ruleset Configuration mapping */
        .app-workspace-container { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            background-color: var(--panel-bg); 
            overflow: hidden; 
            display: flex; 
        }

        /* Left-side Global Channel Navigation Module elements styles layout rules */
        .left-navigation-bar { width: 300px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .navigation-section-container { display: flex; flex-direction: column; overflow: hidden; }
        .navigation-scroller-track { overflow-y: auto; max-height: 240px; padding: 4px 0; }
        .section-label-header { padding: 18px 24px 8px 24px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .action-add-node { cursor: pointer; font-size: 1.2rem; color: var(--text-muted); font-weight: bold; }
        .action-add-node:hover { color: var(--primary); }

        /* Modernized inline friend lookup panel component layout rules */
        .search-action-wrapper { padding: 4px 20px 14px 20px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
        .search-action-field { flex: 1; padding: 8px 14px; background: #111827; border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 0.85rem; outline: none; }
        .search-action-field:focus { border-color: var(--primary); }
        .search-action-btn { background: var(--primary); color: white; border: none; padding: 0 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: 0.2s; }
        .search-action-btn:hover { background: var(--primary-hover); }

        /* Interactive list row element layouts mapping configurations rules */
        .navigation-row-item { display: flex; align-items: center; padding: 10px 24px; cursor: pointer; transition: all 0.2s; gap: 14px; font-weight: 500; font-size: 0.95rem; color: #9ca3af; }
        .navigation-row-item:hover { background-color: #0f172a; color: white; }
        .navigation-row-item.active-node { background-color: #1e1b4b; color: #c7d2fe; font-weight: 600; border-left: 4px solid var(--primary); padding-left: 20px; }
        
        .avatar-frame { width: 34px; height: 34px; border-radius: 50%; background-color: #1f2937; color: white; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; text-transform: uppercase; }

        /* Core Application Chat Log stream view area container box structure */
        .central-communication-stream { flex: 1; display: flex; flex-direction: column; background-color: var(--panel-bg); height: 100%; min-width: 0; }
        .stream-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background-color: #0b0f19; }
        .stream-header h2 { font-size: 1.2rem; font-weight: 800; color: white; margin: 0; }
        .stream-history-scroller { flex: 1; padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background-color: #070a12; }

        /* Intelligent chat text cloud item box styling structures layouts configuration mapping */
        .message-bubble-row { display: flex; flex-direction: column; max-width: 75%; width: fit-content; }
        .message-bubble-row.peer-node { align-self: flex-start; }
        .message-bubble-row.client-node { align-self: flex-end; align-items: flex-end; }
        .message-bubble-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
        .message-bubble-content-cloud { padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .message-bubble-row.peer-node .message-bubble-content-cloud { background-color: #1f2937; color: #f9fafb; border-top-left-radius: 4px; }
        .message-bubble-row.client-node .message-bubble-content-cloud { background-color: var(--primary); color: #ffffff; border-top-right-radius: 4px; }

        /* Bottom entry bar module controls wrapper setup config mapping rules */
        .message-input-area { padding: 18px 28px; border-top: 1px solid var(--border); background-color: #0b0f19; display: flex; gap: 14px; align-items: center; }
        .message-input-area input { flex: 1; padding: 14px 22px; border: 1px solid var(--border); border-radius: 30px; outline: none; font-size: 0.95rem; background-color: #111827; color: white; transition: all 0.2s; }
        .message-input-area input:focus { border-color: var(--primary); background-color: #070a12; }
        .message-send-btn { background-color: var(--primary); color: white; border: none; border-radius: 30px; padding: 0 26px; font-weight: 700; height: 46px; cursor: pointer; transition: background 0.2s; }
        .message-send-btn:hover { background-color: var(--primary-hover); }

        /* Interactive system user settings footer control card rules */
        .profile-settings-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border); background-color: #030712; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .profile-settings-footer:hover { background-color: #0b0f19; }
        .profile-footer-meta { display: flex; flex-direction: column; overflow: hidden; }
        .profile-footer-name-lbl { font-size: 0.9rem; font-weight: 700; color: white; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .profile-footer-status-lbl { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

        /* Modal dashboard setting config engine style definition mapping setup rules */
        #settings-dashboard-modal { display: none; position: fixed; inset: 0; background: rgba(3,7,18,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .settings-dashboard-card { background: var(--panel-bg); border: 1px solid var(--border); width: 400px; padding: 32px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .settings-dashboard-card h3 { margin-bottom: 20px; font-weight: 800; font-size: 1.35rem; tracking: -0.03em; color: white; }
        .settings-control-group { margin-bottom: 18px; text-align: left; }
        .settings-control-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.05em; }

        /* Right-side Online Status Active Monitor tracking dashboard component element layouts */
        .right-roster-sidebar { width: 280px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .roster-scroller-track { overflow-y: auto; flex: 1; padding: 4px 0; }
        .online-status-pulse-dot { width: 9px; height: 9px; background-color: #10b981; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 10px #10b981; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2>System Gateway</h2>
            <input type="text" id="auth-field-username" class="auth-input" placeholder="Enter Username ID" autocomplete="off">
            <input type="password" id="auth-field-password" class="auth-input" placeholder="Enter Secret Password">
            <button class="auth-action-btn" onclick="executeSystemLoginRequest()">Authorize Session</button>
            <button class="auth-action-btn" style="background-color: #374151;" onclick="executeSystemRegistrationRequest()">Create User Record</button>
            <div id="auth-log-output"></div>
        </div>
    </div>

    <div id="settings-dashboard-modal">
        <div class="settings-dashboard-card">
            <h3>Profile Customization</h3>
            
            <div class="settings-control-group">
                <label>Avatar Background Hex Color</label>
                <input type="text" id="settings-avatar-color" class="auth-input" placeholder="e.g. #ff5500">
            </div>

            <div class="settings-control-group">
                <label>Single-Character Avatar Icon Letter</label>
                <input type="text" id="settings-avatar-initial" class="auth-input" maxlength="1" placeholder="e.g. X">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button class="auth-action-btn" style="margin: 0;" onclick="saveCustomProfileSettings()">Save Settings</button>
                <button class="auth-action-btn" style="margin: 0; background-color: #374151;" onclick="toggleSettingsDashboard(false)">Cancel</button>
            </div>
        </div>
    </div>

    <div class="app-workspace-container" id="app-workspace-view">
        
        <div class="left-navigation-bar">
            
            <div class="navigation-section-container">
                <div class="section-label-header">
                    <span>Rooms & Channels</span>
                    <span class="action-add-node" onclick="triggerChannelCreationDialog()">+</span>
                </div>
                <div class="navigation-scroller-track" id="dom-channels-injection-box"></div>
            </div>

            <div class="navigation-section-container" style="flex: 1; display: flex; flex-direction: column; margin-top: 12px;">
                <div class="section-label-header">Direct Communication</div>
                
                <div class="search-action-wrapper">
                    <input type="text" id="dom-friend-search-input" class="search-action-field" placeholder="Search user ID to add..." autocomplete="off">
                    <button class="search-action-btn" onclick="submitFriendLookupSearch()">Add</button>
                </div>

                <div class="navigation-scroller-track" style="flex: 1; max-height: none;" id="dom-friends-injection-box"></div>
            </div>

            <div class="profile-settings-footer" onclick="toggleSettingsDashboard(true)">
                <div class="avatar-frame" id="my-footer-avatar-icon">?</div>
                <div class="profile-footer-meta">
                    <span class="profile-footer-name-lbl" id="my-footer-profile-name">Unidentified User</span>
                    <span class="profile-footer-status-lbl">Online (Click to Edit)</span>
                </div>
            </div>
        </div>

        <div class="central-communication-stream">
            <div class="stream-header">
                <h2 id="dom-active-room-title-lbl">global-lounge</h2>
                <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; tracking: 0.05em;" id="dom-room-context-tag-lbl">Channel Stream</div>
            </div>

            <div class="stream-history-scroller" id="dom-chat-history-scroller-viewport"></div>

            <div class="message-input-area">
                <input type="text" id="dom-chat-message-input-field" placeholder="Send secure broadcast communication payload..." autocomplete="off">
                <button class="message-send-btn" onclick="dispatchTextMessagePayload()">Send Message</button>
            </div>
        </div>

        <div class="right-roster-sidebar">
            <div class="section-label-header">Active Peer Roster</div>
            <div class="roster-scroller-track" id="dom-roster-injection-box"></div>
        </div>

    </div>

    <script>
        const socket = io();
        let activeSessionUser = "";
        let activeSessionColor = "#6366f1";
        let activeSessionInitial = "?";
        
        let clientCachedChannels = [];
        let clientCachedFriends = [];
        let activeTargetRoomIdentifier = "global-lounge";

        function executeSystemLoginRequest() {
            const u = document.getElementById('auth-field-username').value.trim();
            const p = document.getElementById('auth-field-password').value;
            if (u && p) socket.emit('login-account', { username: u, password: p });
        }

        function executeSystemRegistrationRequest() {
            const u = document.getElementById('auth-field-username').value.trim();
            const p = document.getElementById('auth-field-password').value;
            if (!u || !p) return;
            const dynamicRandomHexColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            socket.emit('register-account', { username: u, password: p, avatarColor: dynamicRandomHexColor });
        }

        socket.on('auth-response', (response) => {
            const outputLog = document.getElementById('auth-log-output');
            if (response.success) {
                outputLog.innerText = "";
                activeSessionUser = response.username;
                activeSessionColor = response.avatarColor || activeSessionColor;
                activeSessionInitial = response.initial || activeSessionInitial;
                
                clientCachedChannels = response.servers || [];
                clientCachedFriends = response.friends || [];

                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-workspace-view').style.style = 'flex'; // Fix display trigger property mapping setup runtime parameters rule
                document.getElementById('app-workspace-view').style.setProperty('display', 'flex', 'important');

                updateProfileBadgeElements();
                renderChannelsNavigationLayout();
                renderFriendsNavigationLayout();
            } else {
                outputLog.innerText = response.message;
            }
        });

        function updateProfileBadgeElements() {
            document.getElementById('my-footer-profile-name').innerText = activeSessionUser;
            const avatar = document.getElementById('my-footer-avatar-icon');
            avatar.innerText = activeSessionInitial;
            avatar.style.backgroundColor = activeSessionColor;
        }

        // --- DASHBOARD SETTINGS CARD ACTIONS NAVIGATION CONTROL LOGIC ---
        function toggleSettingsDashboard(shouldDisplay) {
            const modal = document.getElementById('settings-dashboard-modal');
            if (shouldDisplay) {
                document.getElementById('settings-avatar-color').value = activeSessionColor;
                document.getElementById('settings-avatar-initial').value = activeSessionInitial;
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        function saveCustomProfileSettings() {
            const chosenColor = document.getElementById('settings-avatar-color').value.trim();
            const chosenInitial = document.getElementById('settings-avatar-initial').value.trim();
            
            socket.emit('update-profile-settings', {
                color: chosenColor,
                initial: chosenInitial
            });
            toggleSettingsDashboard(false);
        }

        socket.on('profile-settings-updated', (data) => {
            if (data.color) activeSessionColor = data.color;
            if (data.initial) activeSessionInitial = data.initial;
            updateProfileBadgeElements();
        });

        // --- CORE APPLICATION AREA NAVIGATION CHANGELOG TARGET CONTROLLERS ---
        function selectActiveRoomTarget(roomID, isDirectMessage = false) {
            activeTargetRoomIdentifier = roomID;
            document.getElementById('dom-active-room-title-lbl').innerText = isDirectMessage ? `@ ${roomID}` : `# ${roomID}`;
            document.getElementById('dom-room-context-tag-lbl').innerText = isDirectMessage ? "Direct Message Stream" : "Channel Stream";
            document.getElementById('dom-chat-message-input-field').placeholder = isDirectMessage ? `Message @ ${roomID}...` : `Message # ${roomID}...`;
            
            document.getElementById('dom-chat-history-scroller-viewport').innerHTML = '';
            
            renderChannelsNavigationLayout();
            renderFriendsNavigationLayout();
        }

        function triggerChannelCreationDialog() {
            const name = prompt("Enter a name for the new chat channel:");
            if (name) socket.emit('create-server', name);
        }

        socket.on('server-list-updated', (channelsList) => {
            clientCachedChannels = channelsList;
            renderChannelsNavigationLayout();
        });

        function renderChannelsNavigationLayout() {
            const container = document.getElementById('dom-channels-injection-box');
            container.innerHTML = "";
            clientCachedChannels.forEach(chan => {
                const isSelected = (activeTargetRoomIdentifier === chan);
                const element = document.createElement('div');
                element.className = `navigation-row-item ${isSelected ? 'active-node' : ''}`;
                element.onclick = () => selectActiveRoomTarget(chan, false);
                element.innerHTML = `<div class="avatar-frame" style="background-color:${isSelected ? 'var(--primary)':'#1f2937'}">#</div><div>${chan}</div>`;
                container.appendChild(element);
            });
        }

        // --- INSTANT FRIEND LOOKUP SYSTEM COMPONENT ACTIONS ---
        function submitFriendLookupSearch() {
            const field = document.getElementById('dom-friend-search-input');
            const entryValue = field.value.trim();
            if (entryValue) {
                socket.emit('add-friend-search', { targetName: entryValue });
                field.value = "";
            }
        }

        document.getElementById('dom-friend-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitFriendLookupSearch();
        });

        socket.on('search-alert', (res) => alert(res.message));

        socket.on('friend-list-updated', (updatedFriendsCollection) => {
            clientCachedFriends = updatedFriendsCollection;
            renderFriendsNavigationLayout();
        });

        function renderFriendsNavigationLayout() {
            const container = document.getElementById('dom-friends-injection-box');
            container.innerHTML = "";
            if (clientCachedFriends.length === 0) {
                container.innerHTML = `<div style="padding: 12px 24px; font-size:0.8rem; color:var(--text-muted); font-style:italic;">No friends added yet. Type a username above to connect!</div>`;
                return;
            }
            clientCachedFriends.forEach(friendName => {
                const directMessageRoomKey = `dm-${friendName.toLowerCase()}`;
                const isSelected = (activeTargetRoomIdentifier.toLowerCase() === directMessageRoomKey);
                const element = document.createElement('div');
                element.className = `navigation-row-item ${isSelected ? 'active-node' : ''}`;
                element.onclick = () => selectActiveRoomTarget(`dm-${friendName}`, true);
                element.innerHTML = `<div class="avatar-frame" style="background-color:#10b981; color:white;">${friendName.charAt(0).toUpperCase()}</div><div>${friendName}</div>`;
                container.appendChild(element);
            });
        }

        // --- ONLINE PEER STATUS SIDEBAR MONITOR INTERACTION ---
        socket.on('online-roster-updated', (onlineListArray) => {
            const container = document.getElementById('dom-roster-injection-box');
            container.innerHTML = "";
            onlineListArray.forEach(peerUser => {
                const isClientUserNode = (peerUser.username === activeSessionUser);
                const element = document.createElement('div');
                element.className = 'navigation-row-item';
                element.style.cursor = 'default';
                element.innerHTML = `
                    <div class="avatar-frame" style="background-color:${peerUser.color}; color:white;">${peerUser.initial}</div>
                    <div style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:130px; color:#e2e8f0;">${peerUser.username} ${isClientUserNode ? '(You)':''}</div>
                    <div class="online-status-pulse-dot"></div>
                `;
                container.appendChild(element);
            });
        });

        // --- TEXT MESSAGING ACTIONS DISPATCH ENGINE ROUTINE ---
        function dispatchTextMessagePayload() {
            const field = document.getElementById('dom-chat-message-input-field');
            const dataText = field.value.trim();
            if (!dataText) return;

            socket.emit('chat message', {
                text: dataText,
                room: activeTargetRoomIdentifier
            });
            field.value = "";
        }

        document.getElementById('dom-chat-message-input-field').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') dispatchTextMessagePayload();
        });

        socket.on('chat message', (packet) => {
            // Verify if message packet belongs to currently open communication room view
            if (packet.room.toLowerCase() !== activeTargetRoomIdentifier.toLowerCase()) return;

            const scrollerViewport = document.getElementById('dom-chat-history-scroller-viewport');
            const isClientSelfNode = (packet.username === activeSessionUser);

            const rowNode = document.createElement('div');
            rowNode.className = `message-bubble-row ${isClientSelfNode ? 'client-node' : 'peer-node'}`;

            rowNode.innerHTML = `
                <div class="message-bubble-meta">
                    <span class="avatar-frame" style="width:18px; height:18px; font-size:0.55rem; background-color:${packet.avatarColor}; color:white;">${packet.initial}</span>
                    <span style="font-weight:700; color: #f1f5f9;">${packet.username}</span>
                    <span style="color:#6b7280; font-size:0.7rem;">${packet.time}</span>
                </div>
                <div class="message-bubble-content-cloud">${packet.text}</div>
            `;
            scrollerViewport.appendChild(rowNode);
            scrollerViewport.scrollTop = scrollerViewport.scrollHeight;
        });
    </script>
</body>
</html>
