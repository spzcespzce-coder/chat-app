<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern App Platform</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f3f4f6;
            --panel-bg: #ffffff;
            --sidebar-bg: #f9fafb;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-dark); }

        #auth-overlay { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .auth-card { background: var(--panel-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 360px; text-align: center; }
        .auth-card h2 { margin-bottom: 24px; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.5px; }
        .auth-field { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 0.95rem; }
        .auth-field:focus { border-color: var(--primary); }
        .auth-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; transition: 0.2s; }
        .auth-btn:hover { background: var(--primary-hover); }
        #auth-log { color: #ef4444; font-size: 0.85rem; margin-top: 8px; min-height: 18px; }

        .app-container { display: none; width: 95vw; max-width: 1440px; height: 90vh; background-color: var(--panel-bg); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.04); overflow: hidden; border: 1px solid var(--border); }

        .left-sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-section { display: flex; flex-direction: column; overflow: hidden; }
        .section-scroll { overflow-y: auto; max-height: 220px; padding: 4px 0; }
        .panel-heading { padding: 16px 20px 8px 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .add-action-icon { cursor: pointer; font-size: 1.1rem; color: var(--text-muted); }
        .add-action-icon:hover { color: var(--primary); }

        .row-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; transition: background 0.2s; position: relative; gap: 12px; font-weight: 500; font-size: 0.95rem; }
        .row-item:hover { background-color: #f3f4f6; }
        .row-item.active { background-color: #e0e7ff; color: var(--primary); font-weight: 600; }
        
        .avatar-circle { width: 36px; height: 36px; border-radius: 50%; background-color: #dbeafe; color: var(--primary); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.9rem; flex-shrink: 0; background-size: cover; background-position: center; text-transform: uppercase; }

        .chat-window { flex: 1; display: flex; flex-direction: column; background-color: var(--panel-bg); }
        .chat-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .chat-header h2 { font-size: 1.15rem; font-weight: 700; }
        .chat-history { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background-color: #fafafa; }

        .msg-row { display: flex; flex-direction: column; max-width: 65%; width: fit-content; }
        .msg-row.them { align-self: flex-start; }
        .msg-row.me { align-self: flex-end; align-items: flex-end; }
        .msg-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; display: flex; gap: 6px; }
        .msg-cloud { padding: 10px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.45; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-row.them .msg-cloud { background-color: #e5e7eb; color: var(--text-dark); border-top-left-radius: 4px; }
        .msg-row.me .msg-cloud { background-color: var(--primary); color: #ffffff; border-top-right-radius: 4px; }

        .input-area { padding: 16px 24px; border-top: 1px solid var(--border); background-color: var(--panel-bg); display: flex; gap: 12px; align-items: center; }
        .input-area input { flex: 1; padding: 12px 20px; border: 1px solid var(--border); border-radius: 24px; outline: none; font-size: 0.95rem; background-color: #f9fafb; transition: 0.2s; }
        .input-area input:focus { border-color: var(--primary); background-color: white; }
        .send-btn { background-color: var(--primary); color: white; border: none; border-radius: 24px; padding: 0 22px; font-weight: 600; height: 42px; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { background-color: var(--primary-hover); }

        .profile-footer { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); background-color: var(--panel-bg); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .profile-footer:hover { background-color: #f9fafb; }
        .user-details { display: flex; flex-direction: column; overflow: hidden; }
        .user-name-tag { font-size: 0.9rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .user-status-text { font-size: 0.75rem; color: var(--text-muted); }

        .right-sidebar { width: 260px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .online-scroll { overflow-y: auto; flex: 1; padding: 4px 0; }
        .online-badge-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
        .action-add-friend { font-size: 0.75rem; background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: auto; transition: 0.2s; }
        .action-add-friend:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <input type="text" id="auth-user" class="auth-field" placeholder="Username" autocomplete="off">
            <input type="password" id="auth-pass" class="auth-field" placeholder="Password">
            <button class="auth-btn" onclick="submitLogin()">Log In</button>
            <button class="auth-btn" style="background-color: var(--text-muted);" onclick="submitRegister()">Create Account</button>
            <div id="auth-log"></div>
        </div>
    </div>

    <div class="app-container" id="app-workspace">
        <div class="left-sidebar">
            <div class="sidebar-section">
                <div class="panel-heading">
                    <span>Rooms & channels</span>
                    <span class="add-action-icon" onclick="triggerCreateRoom()">+</span>
                </div>
                <div class="section-scroll" id="dom-channel-box"></div>
            </div>

            <div class="sidebar-section" style="flex: 1; display: flex; flex-direction: column; margin-top: 10px;">
                <div class="panel-heading">Direct Messages</div>
                <div class="section-scroll" style="flex: 1; max-height: none;" id="dom-friends-box"></div>
            </div>

            <div class="profile-footer" onclick="triggerProfileCustomization()">
                <div class="avatar-circle" id="my-footer-avatar">?</div>
                <div class="user-details">
                    <span class="user-name-tag" id="my-footer-name">Guest Identity</span>
                    <span class="user-status-text">Online Profile (Edit)</span>
                </div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <h2 id="dom-active-room-label">Global Lounge</h2>
                <div style="font-size: 0.85rem; color: var(--text-muted);" id="dom-header-context-meta">Channel Feed</div>
            </div>

            <div class="chat-history" id="dom-chat-stream"></div>

            <div class="input-area">
                <input type="text" id="dom-msg-field" placeholder="Write a broadcast message..." autocomplete="off">
                <button class="send-btn" onclick="executeMessageBroadcast()">Send</button>
            </div>
        </div>

        <div class="right-sidebar">
            <div class="panel-heading">Active Roster</div>
            <div class="online-scroll" id="dom-online-box"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let clientUser = "";
        let clientColor = "#4f46e5";
        let clientImage = null;
        
        let clientRoomsList = [];
        let clientFriendsCollection = [];
        let activeSelectedTargetRoom = "global-lounge";

        function submitLogin() {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value;
            if(u && p) socket.emit('login-account', { username: u, password: p });
        }

        function submitRegister() {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value;
            if(!u || !p) return;
            const ranColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            socket.emit('register-account', { username: u, password: p, avatarColor: ranColor });
        }

        socket.on('auth-response', (res) => {
            const logBox = document.getElementById('auth-log');
            if(res.success) {
                logBox.innerText = "";
                clientUser = res.username || document.getElementById('auth-user').value.trim();
                clientColor = res.avatarColor || clientColor;
                clientImage = res.avatarImage || null;
                
                clientRoomsList = res.servers || ['global-lounge', 'coding-zone', 'chatgpt-bot'];
                clientFriendsCollection = res.friends || [];

                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-workspace').style.display = 'flex';

                updateProfileInterfacePlates();
                refreshChannelLayoutBox();
                refreshFriendsLayoutBox();
            } else {
                logBox.innerText = res.message;
            }
        });

        function updateProfileInterfacePlates() {
            document.getElementById('my-footer-name').innerText = clientUser;
            const myAv = document.getElementById('my-footer-avatar');
            myAv.innerText = clientUser.charAt(0);
            myAv.style.backgroundColor = clientColor;
        }

        function changeTargetRoomState(roomIdentity, isDirectMessage = false) {
            activeSelectedTargetRoom = roomIdentity;
            document.getElementById('dom-active-room-label').innerText = isDirectMessage ? `@${roomIdentity}` : `#${roomIdentity}`;
            document.getElementById('dom-header-context-meta').innerText = isDirectMessage ? "Direct Message Feed" : "Channel Feed";
            document.getElementById('dom-msg-field').placeholder = isDirectMessage ? `Message @${roomIdentity}...` : `Message #${roomIdentity}...`;
            
            document.getElementById('dom-chat-stream').innerHTML = '';
            
            refreshChannelLayoutBox();
            refreshFriendsLayoutBox();
        }

        function triggerCreateRoom() {
            const newName = prompt("Enter new channel name:");
            if(newName) socket.emit('create-server', newName);
        }

        socket.on('server-list-updated', (servers) => {
            clientRoomsList = servers;
            refreshChannelLayoutBox();
        });

        function refreshChannelLayoutBox() {
            const container = document.getElementById('dom-channel-box');
            container.innerHTML = "";
            clientRoomsList.forEach(srv => {
                const isActive = (activeSelectedTargetRoom === srv);
                const item = document.createElement('div');
                item.className = `row-item ${isActive ? 'active' : ''}`;
                item.onclick = () => changeTargetRoomState(srv, false);
                item.innerHTML = `<div class="avatar-circle" style="background-color:${isActive ? 'var(--primary)':'#e5e7eb'}; color:${isActive?'white':'#4b5563'}">#</div><div>${srv}</div>`;
                container.appendChild(item);
            });
        }

        // SIMPLIFIED INSTANT ADD SCRIPT EXECUTION
        function addFriendInstant(targetName) {
            socket.emit('add-friend-instant', { targetName });
        }

        socket.on('friend-list-updated', (updatedFriends) => {
            clientFriendsCollection = updatedFriends;
            refreshFriendsLayoutBox();
            // Re-fetch online layout roster states seamlessly
            socket.emit('login-account', { username: clientUser, password: document.getElementById('auth-pass').value });
        });

        function refreshFriendsLayoutBox() {
            const container = document.getElementById('dom-friends-box');
            container.innerHTML = "";
            if(clientFriendsCollection.length === 0) {
                container.innerHTML = `<div style="padding: 10px 20px; font-size:0.85rem; color:var(--text-muted); font-style:italic;">No friends yet. Add users via Active Roster.</div>`;
                return;
            }
            clientFriendsCollection.forEach(frn => {
                const dmRoomID = `dm-${frn}`;
                const isActive = (activeSelectedTargetRoom === dmRoomID);
                const item = document.createElement('div');
                item.className = `row-item ${isActive ? 'active' : ''}`;
                item.onclick = () => changeTargetRoomState(dmRoomID, true);
                item.innerHTML = `<div class="avatar-circle" style="background-color:#10b981; color:white;">${frn.charAt(0)}</div><div>${frn}</div>`;
                container.appendChild(item);
            });
        }

        socket.on('online-roster-updated', (roster) => {
            const container = document.getElementById('dom-online-box');
            container.innerHTML = "";

            roster.forEach(usr => {
                const isSelf = (usr.username === clientUser);
                const isAlreadyFriend = clientFriendsCollection.includes(usr.username);

                const item = document.createElement('div');
                item.className = 'row-item';
                item.style.cursor = 'default';

                let actionElement = `<div class="online-badge-dot"></div>`;
                if(!isSelf && !isAlreadyFriend) {
                    actionElement = `<button class="action-add-friend" onclick="addFriendInstant('${usr.username}')">+</button>`;
                }

                item.innerHTML = `
                    <div class="avatar-circle" style="background-color:${usr.color};">${usr.username.charAt(0)}</div>
                    <div style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:120px;">${usr.username} ${isSelf ? '(You)':''}</div>
                    ${actionElement}
                `;
                container.appendChild(item);
            });
        });

        function executeMessageBroadcast() {
            const field = document.getElementById('dom-msg-field');
            const txt = field.value.trim();
            if(!txt) return;

            socket.emit('chat message', {
                text: txt,
                room: activeSelectedTargetRoom,
                username: clientUser,
                avatarColor: clientColor
            });
            field.value = "";
        }

        document.getElementById('dom-msg-field').addEventListener('keypress', (e) => { if(e.key === 'Enter') executeMessageBroadcast(); });

        socket.on('chat message', (data) => {
            if(data.room !== activeSelectedTargetRoom) return;

            const stream = document.getElementById('dom-chat-stream');
            const isMe = (data.username === clientUser);

            const row = document.createElement('div');
            row.className = `msg-row ${isMe ? 'me' : 'them'}`;

            row.innerHTML = `
                <div class="msg-meta">
                    <span style="font-weight:700;">${data.username}</span>
                    <span>${data.time}</span>
                </div>
                <div class="msg-cloud">${data.text}</div>
            `;
            stream.appendChild(row);
            stream.scrollTop = stream.scrollHeight;
        });

        function triggerProfileCustomization() {
            const nextColor = prompt("Enter a hex color for your profile avatar background (e.g. #ff5500):", clientColor);
            if(nextColor) {
                clientColor = nextColor;
                socket.emit('update-profile-settings', { color: nextColor });
            }
        }

        socket.on('profile-settings-updated', (data) => {
            if(data.color) clientColor = data.color;
            updateProfileInterfacePlates();
        });
    </script>
</body>
</html>
