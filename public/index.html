<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chat App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-container { display: flex; width: 90%; max-width: 1200px; height: 90vh; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .sidebar { width: 300px; background-color: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #e0e0e0; background-color: #f8f9fa; }
        .contact { display: flex; align-items: center; padding: 15px 20px; background-color: #eaf3ff; }
        .contact-avatar { width: 45px; height: 45px; border-radius: 50%; background-color: #007bff; margin-right: 15px; }
        .chat-window { flex: 1; display: flex; flex-direction: column; background-color: #fefefe; }
        .chat-header { padding: 20px; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: #f9fbfd; }
        .message-row { display: flex; width: 100%; }
        .message-row.them { justify-content: flex-start; }
        .message-row.me { justify-content: flex-end; }
        .bubble { max-width: 60%; padding: 12px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; }
        .message-row.them .bubble { background-color: #e9ecef; color: #333; border-bottom-left-radius: 4px; }
        .message-row.me .bubble { background-color: #007bff; color: #ffffff; border-bottom-right-radius: 4px; }
        .input-area { padding: 15px 20px; background-color: #ffffff; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px 20px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 1rem; }
        .send-btn { background-color: #007bff; color: white; border: none; border-radius: 25px; padding: 0 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">Global Chatroom</div>
            <div class="contact">
                <div class="contact-avatar"></div>
                <div><strong>Everyone</strong></div>
            </div>
        </div>

        <div class="chat-window">
            <div class="chat-header"><h2>Live Feed</h2></div>
            <div class="chat-history" id="chat-history"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button class="send-btn" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); 
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');

        function appendMessage(text, side) {
            const messageRow = document.createElement('div');
            messageRow.className = `message-row ${side}`;
            messageRow.innerHTML = `<div class="bubble">${text}</div>`;
            chatHistory.appendChild(messageRow);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text !== '') {
                appendMessage(text, 'me'); 
                socket.emit('chat message', text); 
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        socket.on('chat message', (msg) => {
            appendMessage(msg, 'them'); 
        });
    </script>
</body>
</html>
