<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chat App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Main App Container */
        .app-container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Left Side: Contact List */
        .sidebar {
            width: 300px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
            background-color: #f8f9fa;
        }

        .contact-list {
            overflow-y: auto;
        }

        .contact {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .contact:hover, .contact.active {
            background-color: #eaf3ff;
        }

        .contact-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #ccc;
            margin-right: 15px;
        }

        /* Right Side: Chat Window */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fefefe;
        }

        .chat-header {
            padding: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
        }

        .chat-header .contact-avatar {
            background-color: #007bff;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #f9fbfd;
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.them {
            justify-content: flex-start;
        }

        .message-row.me {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message-row.them .bubble {
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-row.me .bubble {
            background-color: #007bff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }

        .input-area input:focus {
            border-color: #007bff;
        }

        .send-btn {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Messages</div>
            <div class="contact-list">
                <div class="contact active">
                    <div class="contact-avatar" style="background-color: #007bff;"></div>
                    <div>
                        <strong>Alice</strong>
                        <div style="font-size: 0.8rem; color: #666;">Hey, what's up?</div>
                    </div>
                </div>
                <div class="contact">
                    <div class="contact-avatar" style="background-color: #ffc107;"></div>
                    <div>
                        <strong>Bob</strong>
                        <div style="font-size: 0.8rem; color: #666;">See you tomorrow!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Window -->
        <div class="chat-window">
            <div class="chat-header">
                <div class="contact-avatar" style="background-color: #007bff;"></div>
                <h2>Alice</h2>
            </div>
            
            <div class="chat-history" id="chat-history">
                <div class="message-row them">
                    <div class="bubble">Hey! Did you finish that coding project?</div>
                </div>
                <div class="message-row me">
                    <div class="bubble">Almost done! Just working on the UI now.</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button class="send-btn" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text !== '') {
                // Create your message bubble
                const messageRow = document.createElement('div');
                messageRow.className = 'message-row me';
                messageRow.innerHTML = `<div class="bubble">${text}</div>`;
                
                chatHistory.appendChild(messageRow);
                messageInput.value = '';
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
